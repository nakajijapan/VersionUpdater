name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      matrix:
        xcode: ['16.4']
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Swift Package Manager (build & test)
        run: swift build && swift test

      - name: Build
        run: xcodebuild build -project VersionUpdater.xcodeproj -scheme VersionUpdater -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'

      - name: Run tests
        run: xcodebuild test -project VersionUpdater.xcodeproj -scheme VersionUpdater -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
