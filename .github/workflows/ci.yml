name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      matrix:
        xcode: ['16.4']
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Swift Package Manager (build & test)
        run: swift build && swift test

      # Compile the framework and test target for the iOS simulator SDK using the
      # generic destination (always available — no concrete device to resolve, so
      # this can't fail on runners that ship without pre-created simulators). Test
      # execution itself is covered by the SPM step above (the tests are pure logic).
      - name: Build for iOS (framework + tests)
        run: xcodebuild build-for-testing -project VersionUpdater.xcodeproj -scheme VersionUpdater -destination 'generic/platform=iOS Simulator'
